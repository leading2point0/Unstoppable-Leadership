services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unstoppable
      POSTGRES_PASSWORD: unstoppable
      POSTGRES_DB: unstoppable
    ports:
      - "5432:5432"
    volumes:
      - unstoppable_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unstoppable"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unstoppable_postgres_data:
