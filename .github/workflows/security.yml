name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly audit even without new commits, so newly disclosed
    # vulnerabilities in existing dependencies are still caught.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Runs at high severity so it stays visible in the Actions log (never
      # silently skipped), but does not hard-block merges: the current
      # findings are a devDependency-only tool chain (eslint, drizzle-kit's
      # config loader) and Next.js's own internally bundled postcss/sharp,
      # none of which are reachable from the shipped application. See
      # SECURITY.md for the tracked list and re-evaluate on every dependency
      # bump.
      - name: Audit (high and critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
